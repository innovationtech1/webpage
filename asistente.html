<style>
  :root{
    --bg:#EEF1F7;--surface:#FFFFFF;--surface-2:#F5F8FC;--glass:rgba(255,255,255,.72);
    --ink:#0C1526;--ink-soft:#24334C;--muted:#58657E;--line:#DCE3EF;--line-soft:#E9EEF6;
    --accent:#2450E6;--accent-2:#12B4E6;--accent-ink:#1636A8;--amber:#F5990B;--wa:#1FB855;--good:#12A150;
    --grad:linear-gradient(120deg,#2450E6,#12B4E6);
    --shadow-xl:0 40px 80px -36px rgba(12,21,38,.34);--shadow:0 20px 44px -24px rgba(12,21,38,.28);--shadow-sm:0 4px 14px -6px rgba(12,21,38,.22);
    --radius:16px;--font-display:"Bricolage Grotesque","Trebuchet MS",sans-serif;--font-body:"IBM Plex Sans",system-ui,sans-serif;
  }
  :root:not([data-theme="light"]){@media (prefers-color-scheme:dark){
    --bg:#070A11;--surface:#121A28;--surface-2:#0E1522;--glass:rgba(18,26,40,.7);
    --ink:#EAF0FB;--ink-soft:#C4D0E4;--muted:#8A99B6;--line:#212C40;--line-soft:#19212F;
    --accent:#5B82FF;--accent-2:#35D0F2;--accent-ink:#A9BEFF;--amber:#FFBC49;--wa:#25D366;--good:#35D07F;
    --grad:linear-gradient(120deg,#5B82FF,#35D0F2);
    --shadow-xl:0 40px 90px -40px rgba(0,0,0,.75);--shadow:0 24px 50px -28px rgba(0,0,0,.65);--shadow-sm:0 4px 16px -6px rgba(0,0,0,.55);
  }}
  :root[data-theme="dark"]{
    --bg:#070A11;--surface:#121A28;--surface-2:#0E1522;--glass:rgba(18,26,40,.7);
    --ink:#EAF0FB;--ink-soft:#C4D0E4;--muted:#8A99B6;--line:#212C40;--line-soft:#19212F;
    --accent:#5B82FF;--accent-2:#35D0F2;--accent-ink:#A9BEFF;--amber:#FFBC49;--wa:#25D366;--good:#35D07F;
    --grad:linear-gradient(120deg,#5B82FF,#35D0F2);
    --shadow-xl:0 40px 90px -40px rgba(0,0,0,.75);--shadow:0 24px 50px -28px rgba(0,0,0,.65);--shadow-sm:0 4px 16px -6px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.55;-webkit-font-smoothing:antialiased;margin:0;}
  h1,h2,h3{font-family:var(--font-display);margin:0;letter-spacing:-.02em;line-height:1.1;}
  a{color:inherit;text-decoration:none;}

  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);backdrop-filter:blur(16px);border-bottom:1px solid var(--line-soft);}
  .nav{max-width:1240px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:12px;}
  .brand{display:inline-flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:800;font-size:1.1rem;}
  .brand .it{color:var(--accent);}
  .logo-ic{width:34px;height:34px;flex:none;}
  .tag{margin-left:6px;font-family:monospace;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:3px 9px;}
  .nav .sp{margin-left:auto;}
  .icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);cursor:pointer;display:grid;place-items:center;}

  .app{max-width:1240px;margin:0 auto;padding:20px 20px 40px;display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:stretch;}

  /* chat */
  .chat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;height:78vh;min-height:560px;overflow:hidden;}
  .chat-head{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid var(--line-soft);}
  .chat-head .av{width:42px;height:42px;border-radius:12px;flex:none;background:var(--grad);display:grid;place-items:center;}
  .chat-head .nm{font-family:var(--font-display);font-weight:800;font-size:1rem;}
  .chat-head .st{font-size:.74rem;color:var(--good);display:flex;align-items:center;gap:5px;}
  .chat-head .st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good);}
  .log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;}
  .msg{max-width:85%;padding:11px 14px;border-radius:14px;font-size:.95rem;line-height:1.45;animation:pop .2s ease;}
  @keyframes pop{from{transform:translateY(6px);opacity:0;}}
  .msg.bot{background:var(--surface-2);border:1px solid var(--line-soft);align-self:flex-start;border-bottom-left-radius:4px;}
  .msg.user{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
  .quicks{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 8px;}
  .quick{background:var(--surface);border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:8px 15px;font-size:.88rem;font-weight:600;cursor:pointer;font-family:var(--font-body);transition:background .15s,color .15s;}
  .quick:hover{background:var(--accent);color:#fff;}
  .quick.sw{width:34px;height:34px;padding:0;border:0;}
  .quick.sw[data-sel=1]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink);}
  .composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line-soft);background:var(--surface-2);}
  .composer input{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:11px 15px;font-family:var(--font-body);font-size:.92rem;outline:none;}
  .composer input:focus{border-color:var(--accent);}
  .composer button{background:var(--accent);border:0;width:44px;height:44px;border-radius:50%;color:#fff;cursor:pointer;display:grid;place-items:center;flex:none;}
  .composer button:disabled{opacity:.4;cursor:not-allowed;}
  .typing{display:inline-flex;gap:4px;}.typing span{width:7px;height:7px;background:var(--muted);border-radius:50%;animation:blink 1.2s infinite;}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}

  /* preview */
  .pv{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;height:78vh;min-height:560px;}
  .pv-bar{height:40px;display:flex;align-items:center;gap:7px;padding:0 14px;background:var(--surface-2);border-bottom:1px solid var(--line-soft);flex:none;}
  .pv-bar i{width:9px;height:9px;border-radius:50%;}
  .pv-url{margin-left:8px;font-size:.76rem;color:var(--muted);font-family:monospace;}
  #preview{flex:1;width:100%;border:0;background:#fff;}
  .pv-foot{flex:none;padding:12px;border-top:1px solid var(--line-soft);background:var(--surface-2);display:none;flex-direction:column;gap:8px;}
  .pv-foot.show{display:flex;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-body);font-weight:600;font-size:.92rem;padding:12px 18px;border-radius:11px;border:1px solid transparent;cursor:pointer;width:100%;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--line);}
  .foot-note{font-size:.76rem;color:var(--muted);text-align:center;}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 20px;border-radius:999px;font-weight:600;font-size:.9rem;box-shadow:var(--shadow-xl);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;}
  .toast.show{opacity:1;}

  @media (max-width:900px){
    .app{grid-template-columns:1fr;}
    .chat{height:auto;min-height:0;}
    .log{max-height:52vh;}
    .pv{height:60vh;min-height:420px;}
  }
</style>

<header>

<script>
  // ============ PAGO (Stripe) ============
  var PAYMENT_LINK = "https://buy.stripe.com/test_aFaeVd3Co3LCedF7Hp6Ri01";
  var PRICE_LABEL = "$99 USD";
  var unlocked = false;

  function $(id){ return document.getElementById(id); }
  function toast(m){ var t=$("toast"); t.textContent=m; t.classList.add("show"); setTimeout(function(){t.classList.remove("show");},2200); }
  function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  // tema
  (function(){ var r=document.documentElement,b=$("themeBtn"),s=null; try{s=localStorage.getItem("it-theme");}catch(e){}
    if(s) r.setAttribute("data-theme",s);
    b.addEventListener("click",function(){var a=r.getAttribute("data-theme");var d=a==="dark"||(!a&&matchMedia("(prefers-color-scheme:dark)").matches);var n=d?"light":"dark";r.setAttribute("data-theme",n);try{localStorage.setItem("it-theme",n);}catch(e){}});
  })();

  // ============ MOTOR DE PÁGINA (mismo del generador) ============
  var FONTS={
    moderno:{d:"'Bricolage Grotesque',sans-serif",b:"'IBM Plex Sans',sans-serif",g:"Bricolage+Grotesque:wght@700;800&family=IBM+Plex+Sans:wght@400;600",r:"16px"},
    elegante:{d:"'Playfair Display',serif",b:"'IBM Plex Sans',sans-serif",g:"Playfair+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;600",r:"4px"},
    vibrante:{d:"'Baloo 2',sans-serif",b:"'Nunito Sans',sans-serif",g:"Baloo+2:wght@700;800&family=Nunito+Sans:wght@400;600",r:"26px"},
    minimalista:{d:"'IBM Plex Sans',sans-serif",b:"'IBM Plex Sans',sans-serif",g:"IBM+Plex+Sans:wght@400;600;700",r:"2px"}
  };
  var GIRO_LABEL={restaurante:"Restaurante",clinica:"Salud",salon:"Estética",tienda:"Comercio",gimnasio:"Fitness",profesional:"Profesional"};
  var GIRO_CTA={restaurante:"Ver menú",clinica:"Agendar cita",salon:"Reservar",tienda:"Ver productos",gimnasio:"Prueba gratis",profesional:"Solicitar info"};
  var SUG={restaurante:"Sabor casero que enamora.",clinica:"Tu salud en las mejores manos.",salon:"Realza tu belleza natural.",tienda:"Todo lo que buscas, en un solo lugar.",gimnasio:"Tu mejor versión empieza hoy.",profesional:"Soluciones profesionales y confiables."};

  function buildSite(d){
    var f=FONTS[d.estilo], cta=GIRO_CTA[d.giro]||"Contáctanos";
    var waLink="https://wa.me/"+(d.wa||"")+"?text="+encodeURIComponent("Hola "+d.name+", vi su página y quiero más información.");
    var cards=(d.serv&&d.serv.length?d.serv:["Servicio 1","Servicio 2","Servicio 3"]).map(function(s){
      return '<div class="card"><div class="ic">'+esc((s||"?").charAt(0).toUpperCase())+'</div><h3>'+esc(s)+'</h3></div>';
    }).join("");
    var cityLine=d.city?'<p class="loc">📍 '+esc(d.city)+'</p>':'';
    var mailBtn=d.mail?'<a class="cbtn" href="mailto:'+esc(d.mail)+'">'+esc(d.mail)+'</a>':'';
    return '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(d.name)+'</title>'+
    '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family='+f.g+'&display=swap">'+
    '<style>:root{--c:'+d.color+';--r:'+f.r+';}*{box-sizing:border-box;margin:0;padding:0;}body{font-family:'+f.b+';color:#1a2233;line-height:1.6;background:#fff;}h1,h2,h3{font-family:'+f.d+';line-height:1.1;}a{text-decoration:none;color:inherit;}.wrap{max-width:1040px;margin:0 auto;padding:0 20px;}'+
    'header{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid #eee;z-index:10;}.nav{display:flex;align-items:center;justify-content:space-between;height:62px;}.logo{font-family:'+f.d+';font-weight:800;font-size:1.25rem;color:var(--c);}.navbtn{background:var(--c);color:#fff;padding:8px 15px;border-radius:var(--r);font-weight:700;font-size:.85rem;}'+
    '.hero{padding:76px 0;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 65%,#000));color:#fff;text-align:center;}.hero .tag{font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;opacity:.85;}.hero h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:800;margin:14px 0;}.hero p{font-size:1.15rem;opacity:.92;max-width:40ch;margin:0 auto 24px;}.hero .cta{display:inline-block;background:#fff;color:var(--c);padding:13px 26px;border-radius:var(--r);font-weight:700;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);}'+
    'section{padding:60px 0;}.st{text-align:center;font-size:clamp(1.5rem,4vw,2.2rem);font-weight:800;margin-bottom:8px;}.sl{text-align:center;color:#667;margin-bottom:36px;}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}.card{background:#f8fafc;border:1px solid #eef1f6;border-radius:calc(var(--r) + 4px);padding:26px 18px;text-align:center;}.card .ic{width:52px;height:52px;border-radius:50%;background:color-mix(in srgb,var(--c) 15%,#fff);color:var(--c);display:grid;place-items:center;margin:0 auto 12px;font-family:'+f.d+';font-weight:800;font-size:1.4rem;}.card h3{font-size:1.1rem;}'+
    '.why{background:#f8fafc;}.why .card{background:#fff;}.contact{text-align:center;}.contact .loc{color:#667;margin-bottom:18px;}.cbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}.cbtn{background:#fff;border:2px solid var(--c);color:var(--c);padding:12px 22px;border-radius:var(--r);font-weight:700;}.cbtn.wa{background:#1FB855;border-color:#1FB855;color:#fff;}'+
    'footer{background:#0f172a;color:#cbd5e1;text-align:center;padding:28px 20px;font-size:.9rem;}.fab{position:fixed;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:#1FB855;display:grid;place-items:center;box-shadow:0 10px 26px -8px rgba(12,124,57,.6);}@media(max-width:760px){.cards{grid-template-columns:1fr;}}</style></head><body>'+
    '<header><div class="wrap nav"><span class="logo">'+esc(d.name)+'</span><a class="navbtn" href="'+waLink+'" target="_blank" rel="noopener">'+cta+'</a></div></header>'+
    '<section class="hero"><div class="wrap"><div class="tag">'+(GIRO_LABEL[d.giro]||"")+'</div><h1>'+esc(d.name)+'</h1><p>'+esc(d.slogan||"Bienvenido. Estamos para servirte.")+'</p><a class="cta" href="'+waLink+'" target="_blank" rel="noopener">'+cta+'</a></div></section>'+
    '<section><div class="wrap"><h2 class="st">Lo que ofrecemos</h2><p class="sl">Conoce nuestros servicios</p><div class="cards">'+cards+'</div></div></section>'+
    '<section class="why"><div class="wrap"><h2 class="st">¿Por qué elegirnos?</h2><p class="sl">Calidad y atención que se notan</p><div class="cards"><div class="card"><div class="ic">★</div><h3>Calidad</h3></div><div class="card"><div class="ic">⚡</div><h3>Atención rápida</h3></div><div class="card"><div class="ic">♥</div><h3>Trato cercano</h3></div></div></div></section>'+
    '<section class="contact"><div class="wrap"><h2 class="st">Contáctanos</h2>'+cityLine+'<div class="cbtns"><a class="cbtn wa" href="'+waLink+'" target="_blank" rel="noopener">Escríbenos por WhatsApp</a>'+mailBtn+'</div></div></section>'+
    '<footer>© '+new Date().getFullYear()+' '+esc(d.name)+' · Hecho con InnovationTech</footer>'+
    '<a class="fab" href="'+waLink+'" target="_blank" rel="noopener" aria-label="WhatsApp"><svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2z"/></svg></a></body></html>';
  }

  // ============ ESTADO ============
  var d={name:"Tu Negocio",giro:"restaurante",slogan:"",wa:"",serv:["Tu servicio 1","Tu servicio 2","Tu servicio 3"],city:"",mail:"",estilo:"moderno",color:"#2450E6"};
  var currentHTML="";
  function render(){ currentHTML=buildSite(d); $("preview").srcdoc=currentHTML; $("pvUrl").textContent=(d.name.toLowerCase().replace(/[^a-z0-9]+/g,"")||"tunegocio")+".com"; }

  // ============ CHAT ============
  var log=$("log"), input=$("input"), send=$("send"), quicks=$("quicks");
  function addMsg(html,who){ var m=document.createElement("div"); m.className="msg "+who; m.innerHTML=html; log.appendChild(m); log.scrollTop=log.scrollHeight; return m; }
  function typing(cb){ var t=document.createElement("div"); t.className="msg bot"; t.innerHTML='<span class="typing"><span></span><span></span><span></span></span>'; log.appendChild(t); log.scrollTop=log.scrollHeight; setTimeout(function(){ t.remove(); cb(); }, 600); }
  function botSay(html,cb){ typing(function(){ addMsg(html,"bot"); if(cb) cb(); }); }
  function clearQuicks(){ quicks.innerHTML=""; }
  function setInput(on,ph){ input.disabled=!on; send.disabled=!on; input.placeholder=ph||"Escribe aquí…"; if(on) setTimeout(function(){input.focus();},50); }

  var STEPS=[
    {k:"start",msg:"¡Hola! 👋 Soy tu asistente de InnovationTech. En unos minutos armamos juntos tu página web, paso a paso. ¿Comenzamos?",quicks:[["¡Vamos! 🚀","go"]]},
    {k:"name",msg:"Perfecto. Para empezar, ¿cómo se llama tu negocio?",input:"Ej. Tacos El Güero"},
    {k:"giro",msg:function(){return '¡"'+esc(d.name)+'" suena genial! ¿A qué se dedica?';},choices:[["restaurante","🍔 Restaurante / Comida"],["clinica","🏥 Clínica / Salud"],["salon","💇 Salón / Estética"],["tienda","🛍️ Tienda / Comercio"],["gimnasio","💪 Gimnasio"],["profesional","💼 Servicios profesionales"]]},
    {k:"slogan",msg:"En una frase corta, ¿qué ofreces? (o toca «Sugerir tú» y yo la escribo)",input:"Ej. Los mejores tacos de la ciudad",quicks:[["✨ Sugerir tú","sug"]]},
    {k:"wa",msg:"¿A qué WhatsApp quieres que te contacten? Ponlo con lada de país (solo números).",input:"Ej. 12109900532"},
    {k:"serv",msg:"Dime 3 cosas que ofreces, separadas por coma.",input:"Ej. Tacos, Tortas, Bebidas"},
    {k:"color",msg:"¡Vamos muy bien! 🎨 ¿Qué color va con tu marca?",swatches:[["#2450E6","Azul"],["#0E9F6E","Verde"],["#E0452B","Rojo"],["#7A1FA2","Morado"],["#F5990B","Naranja"],["#0F172A","Negro"]]},
    {k:"estilo",msg:"Último paso: ¿qué estilo te gusta más?",choices:[["moderno","Moderno"],["elegante","Elegante"],["vibrante","Vibrante"],["minimalista","Minimalista"]]},
    {k:"done",msg:function(){return '¡Listo, '+esc(d.name)+' ya tiene su página! 🎉 Míra la vista previa aquí al lado 👉 Cuando te guste, puedes descargarla.';}}
  ];
  var si=0;

  function faq(text){
    var s=text.toLowerCase();
    if(/precio|cuesta|cu[aá]nto vale|cu[aá]nto es|costo/.test(s)) return "Tu página cuesta <b>"+PRICE_LABEL+"</b> (pago único). Incluye el diseño, botón de WhatsApp y todo listo para publicar. 😊 Sigamos…";
    if(/tarda|tiempo|cu[aá]ndo|r[aá]pido/.test(s)) return "La armamos aquí en minutos, y publicada queda en 1–2 días. ⚡ Continuemos…";
    if(/cambiar|modificar|editar|equivoc/.test(s)) return "¡Tranquilo! Puedes pedir cambios cuando quieras, sin costo extra en el arranque. Sigamos…";
    if(/gratis|free/.test(s)) return "Crear y ver tu página es gratis. Solo pagas cuando quieras descargarla o publicarla. 👍 Continuemos…";
    if(/hola|buenas|hey/.test(s)) return "¡Hola de nuevo! 😄 Sigamos con tu página…";
    return null;
  }

  function step(){
    var st=STEPS[si];
    var text = typeof st.msg==="function"? st.msg() : st.msg;
    botSay(text, function(){
      clearQuicks();
      if(st.choices){ st.choices.forEach(function(c){ addQuick(c[1],function(){ chooseChoice(st.k,c[0],c[1]); }); }); setInput(false); }
      else if(st.swatches){ st.swatches.forEach(function(c){ addSwatch(c[0],c[1]); }); setInput(false); }
      else if(st.k==="start"){ addQuick("¡Vamos! 🚀",function(){ advance(); }); setInput(false); }
      else if(st.input!==undefined){ setInput(true, st.input); if(st.quicks) st.quicks.forEach(function(q){ addQuick(q[0],function(){ specialQuick(q[1]); }); }); }
      else if(st.k==="done"){ setInput(false); finish(); }
    });
  }
  function addQuick(label,fn){ var b=document.createElement("button"); b.className="quick"; b.type="button"; b.textContent=label; b.addEventListener("click",fn); quicks.appendChild(b); }
  function addSwatch(hex,name){ var b=document.createElement("button"); b.className="quick sw"; b.type="button"; b.style.background=hex; b.title=name; b.setAttribute("aria-label",name); b.addEventListener("click",function(){ d.color=hex; addMsg(name,"user"); render(); nextAfter(); }); quicks.appendChild(b); }

  function chooseChoice(key,val,label){ d[key]=val; addMsg(label,"user"); if(key==="giro"){ /* nada extra */ } render(); nextAfter(); }
  function specialQuick(id){
    var st=STEPS[si];
    if(id==="sug"){ d.slogan=SUG[d.giro]||"Bienvenido, estamos para servirte."; addMsg("Sugiéreme una ✨","user"); render(); botSay('Te propongo: <b>"'+esc(d.slogan)+'"</b> 👌', function(){ nextAfter(); }); }
  }
  function nextAfter(){ clearQuicks(); si++; step(); }
  function advance(){ addMsg("¡Vamos! 🚀","user"); nextAfter(); }

  function handleText(v){
    var st=STEPS[si];
    if(st.input===undefined) return;
    // ¿es una pregunta / duda?
    var a=faq(v);
    if(a && (v.indexOf("?")>=0 || /precio|cuesta|tarda|tiempo|cambiar|gratis|cu[aá]nto/.test(v.toLowerCase()))){
      addMsg(esc(v),"user"); botSay(a, function(){ /* repetir paso */ setInput(true, st.input); }); return;
    }
    addMsg(esc(v),"user");
    if(st.k==="name"){ d.name=v.slice(0,40); }
    else if(st.k==="slogan"){ d.slogan=v.slice(0,80); }
    else if(st.k==="wa"){ d.wa=v.replace(/[^0-9]/g,""); }
    else if(st.k==="serv"){ d.serv=v.split(",").map(function(x){return x.trim();}).filter(Boolean).slice(0,6); if(!d.serv.length) d.serv=["Servicio 1","Servicio 2","Servicio 3"]; }
    render();
    nextAfter();
  }

  $("composer").addEventListener("submit",function(e){ e.preventDefault(); var v=input.value.trim(); if(!v) return; input.value=""; handleText(v); });

  // ============ FINAL: pago / descarga ============
  function saveData(){ try{ localStorage.setItem("it_asis_data", JSON.stringify(d)); }catch(e){} }
  function restoreData(){ try{ var x=JSON.parse(localStorage.getItem("it_asis_data")||"null"); if(x) d=x; }catch(e){} }
  function doDownload(){ try{ var blob=new Blob([currentHTML],{type:"text/html"}); var u=URL.createObjectURL(blob); var a=document.createElement("a"); a.href=u; a.download=(d.name.toLowerCase().replace(/[^a-z0-9]+/g,"-")||"mi-sitio")+".html"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(u);},1500); toast("¡Descargando tu página! 🎉"); }catch(e){ toast("No se pudo descargar aquí"); } }
  function finish(){
    var foot=$("pvFoot"); foot.classList.add("show");
    var pay=$("btnPay"), note=$("footNote");
    if(unlocked){ pay.textContent="⬇ Descargar mi página (.html)"; note.textContent="✅ Desbloqueado — descarga cuando quieras."; }
    else { pay.textContent="Pagar y descargar ("+PRICE_LABEL+")"; note.textContent="🔒 Crear tu página es gratis. Paga una vez para descargarla."; }
  }
  $("btnPay").addEventListener("click",function(){
    if(unlocked){ doDownload(); return; }
    if(!PAYMENT_LINK){ toast("El pago aún no está configurado"); return; }
    saveData(); location.href=PAYMENT_LINK;
  });
  $("btnRestart").addEventListener("click",function(){ try{localStorage.removeItem("it_asis_data");}catch(e){} location.href=location.pathname; });

  // ============ ARRANQUE ============
  (function(){
    var p=null; try{ p=new URLSearchParams(location.search); }catch(e){}
    if(p && p.get("owner")==="1") unlocked=true;
    if(p && p.get("pago")==="ok"){ unlocked=true; restoreData(); render();
      // saltar la conversación y mostrar resultado
      addMsg("¡Gracias por tu pago! 🎉 Aquí está tu página, ya puedes descargarla.","bot");
      finish(); setTimeout(doDownload,900); return;
    }
    render();
    step();
  })();
</script>
